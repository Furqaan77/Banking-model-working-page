<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A1328">
<meta name="description" content="How the AI Risk Score Card decides three personal-loan applications at a fictional UAE bank.">
<title>Three Applicants, One Rulebook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: a fixed 1280x720 presentation stage, scaled to fit any screen (no scrolling).
   Bar (brand) / journey rail (where the application is) / scene / caption + controls.
   One visual world on purpose: a night-navy credit room lit in the bank's teal. */
:root{
  color-scheme:dark;
  --bg:#0A1328; --navy:#14213D; --panel:#111D38; --panel2:#16264A; --line:rgba(150,180,215,.18); --line2:rgba(150,180,215,.32);
  --ink:#EAF1F7; --muted:#93A7BC; --dim:#5F7590;
  --teal:#1FB5AA; --teal-deep:#0F7B7B; --glow:rgba(31,181,170,.35);
  --ok:#3DD68C; --refer:#F2B33D; --stop:#FF6B57;
  --c1:#2a78d6; --c2:#eb6834; --c3:#1baf7a;
  --f-disp:"Archivo","Arial Narrow",Arial,sans-serif;
  --f-body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body)}
*{box-sizing:border-box}
#viewport{position:fixed;inset:0;display:grid;place-items:center;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);background:
  radial-gradient(1200px 700px at 50% 40%,#0F1D3D 0%,var(--bg) 70%)}
#viewport{align-items:start}
#stage{width:1280px;height:720px;position:relative;flex:none;transform-origin:top center;margin-top:10px;overflow:hidden;
  background:var(--bg);border-radius:14px;box-shadow:0 30px 80px rgba(0,0,0,.45),0 0 0 1px var(--line)}
#hint{position:fixed;left:0;right:0;bottom:max(14px,env(safe-area-inset-bottom,0px));text-align:center;font-size:13px;color:var(--muted);display:none}

/* atmosphere */
.atmo{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.atmo .grid{position:absolute;inset:-40px;background-image:
  linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:40px 40px;opacity:.22;mask-image:radial-gradient(ellipse at 60% 45%,#000 20%,transparent 75%);
  animation:gridmove 40s linear infinite}
@keyframes gridmove{to{transform:translate(40px,40px)}}
.atmo .orb{position:absolute;width:620px;height:620px;border-radius:50%;filter:blur(60px);opacity:.28;
  background:radial-gradient(circle,var(--teal-deep),transparent 65%);animation:drift 18s ease-in-out infinite alternate}
.atmo .orb.b{width:480px;height:480px;right:-140px;bottom:-160px;background:radial-gradient(circle,#2a78d6,transparent 65%);opacity:.16;animation-duration:23s}
@keyframes drift{from{transform:translate(-120px,-80px)}to{transform:translate(380px,120px)}}

/* top bar */
.bar{position:absolute;left:0;right:0;top:0;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 32px;
  border-bottom:1px solid var(--line);background:rgba(10,19,40,.6);backdrop-filter:blur(6px);z-index:3}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-disp);font-weight:700;font-stretch:110%;font-size:15px;letter-spacing:.01em}
.brand svg{width:24px;height:24px}
.aud{font-size:12px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.aud b{color:var(--ink);font-weight:600}

/* journey rail */
.rail{position:absolute;left:32px;right:32px;top:56px;height:60px;display:grid;grid-template-columns:repeat(9,1fr);align-items:center;z-index:3}
.rail::before{content:"";position:absolute;left:5.5%;right:5.5%;top:23px;height:2px;background:var(--line)}
.rail .fill{position:absolute;left:5.5%;top:23px;height:2px;background:linear-gradient(90deg,var(--teal-deep),var(--teal));width:0;transition:width .8s cubic-bezier(.6,0,.2,1);box-shadow:0 0 12px var(--glow)}
.node{position:relative;display:grid;justify-items:center;gap:6px;background:none;border:0;color:var(--dim);cursor:pointer;font:500 11.5px var(--f-body);padding:8px 0 0;z-index:1}
.node i{width:12px;height:12px;border-radius:50%;background:var(--bg);border:2px solid var(--line2);transition:all .4s}
.node.done{color:var(--muted)} .node.done i{background:var(--teal-deep);border-color:var(--teal)}
.node.now{color:var(--ink)} .node.now i{background:var(--teal);border-color:var(--teal);box-shadow:0 0 0 6px rgba(31,181,170,.18),0 0 18px var(--glow);transform:scale(1.25)}
.node:focus-visible{outline:2px solid var(--teal);outline-offset:4px;border-radius:6px}

/* scenes */
.scenes{position:absolute;left:0;right:0;top:116px;height:524px}
.scene{position:absolute;inset:0;padding:14px 48px 18px;opacity:0;visibility:hidden;transform:translateX(60px) scale(.985);filter:blur(8px);
  transition:opacity .7s ease,transform .8s cubic-bezier(.2,.8,.2,1),filter .7s ease,visibility 0s .8s}
.scene.on{opacity:1;visibility:visible;transform:none;filter:none;transition:opacity .7s ease .15s,transform .8s cubic-bezier(.2,.8,.2,1) .15s,filter .7s ease .15s,visibility 0s}
.scene.past{transform:translateX(-60px) scale(.985)}
.scene:not(.s0){display:flex;flex-direction:column}
.scene:not(.s0)>.head{margin-bottom:0}
.scene:not(.s0)>.head+*{margin-top:auto}
.scene:not(.s0)>:last-child{margin-bottom:auto}
.lane{padding:16px 0!important}
.res{height:52px!important;font-size:16px!important}
.eyebrow{font:600 11.5px var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--teal)}
h1,h2{font-family:var(--f-disp);margin:0;font-stretch:118%;letter-spacing:-.015em;text-wrap:balance}
h2{font-size:33px;font-weight:800;line-height:1.05;margin-top:6px}
h2 em{font-style:normal;color:var(--teal)}
.head{margin-bottom:18px}

/* animation utilities: everything animates in when its scene turns on */
.scene.on .in{animation:rise .75s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d,0s)}
.scene.on .pop{animation:pop .55s cubic-bezier(.2,.9,.3,1.35) both;animation-delay:var(--d,0s)}
.scene.on .fadein{animation:fade .8s ease both;animation-delay:var(--d,0s)}
@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
#stage.paused *,#stage.paused *::before,#stage.paused *::after{animation-play-state:paused!important}

.avatar{width:var(--s,40px);height:var(--s,40px);border-radius:50%;flex:none;display:grid;place-items:center;background:var(--cc);color:#fff;
  font:800 calc(var(--s,40px) * .42) var(--f-disp);box-shadow:0 0 0 3px rgba(255,255,255,.06),0 6px 18px color-mix(in srgb,var(--cc) 45%,transparent)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:14px}
.pill{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:999px;font:700 13px var(--f-disp);font-stretch:105%;white-space:nowrap}
.p-ok{background:rgba(61,214,140,.14);color:var(--ok);box-shadow:inset 0 0 0 1px rgba(61,214,140,.35)}
.p-refer{background:rgba(242,179,61,.14);color:var(--refer);box-shadow:inset 0 0 0 1px rgba(242,179,61,.4)}
.p-stop{background:rgba(255,107,87,.14);color:var(--stop);box-shadow:inset 0 0 0 1px rgba(255,107,87,.42)}
.pill svg{width:14px;height:14px}

/* ---------- S0 title ---------- */
.s0{display:grid;place-items:center;text-align:center}
.s0 .inner{display:grid;justify-items:center;gap:16px;margin-top:-10px}
.s0 h1{font-size:76px;font-weight:900;line-height:.98;font-stretch:125%}
.s0 h1 span{display:block}
.s0 h1 .t2{background:linear-gradient(90deg,var(--teal),#7EE3D9);-webkit-background-clip:text;background-clip:text;color:transparent}
.s0 p{font-size:18px;color:var(--muted);max-width:640px;line-height:1.5;margin:0}
.trio{display:flex;gap:18px;margin-top:6px}
.trio .avatar{--s:58px}
.scene.on .trio .avatar{animation:bounce .9s cubic-bezier(.2,.9,.3,1.4) both;animation-delay:var(--d)}
@keyframes bounce{0%{opacity:0;transform:translateY(-70px) scale(.6)}60%{opacity:1;transform:translateY(6px)}100%{transform:none}}
.chipline{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.tagc{font-size:12.5px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:5px 12px;background:rgba(255,255,255,.02)}
.tagc b{color:var(--ink);font-weight:600}
.press{font:500 13px var(--f-body);color:var(--teal);animation:breathe 2.2s ease-in-out infinite}
@keyframes breathe{50%{opacity:.4}}

/* ---------- S1 applicants ---------- */
.people{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.pcard{padding:22px 22px 20px;display:grid;gap:14px;position:relative;overflow:hidden}
.pcard::after{content:"";position:absolute;inset:0 0 auto;height:3px;background:var(--cc)}
.pcard .top{display:flex;gap:14px;align-items:center}
.pcard .avatar{--s:52px}
.pcard .nm{font:800 24px var(--f-disp);font-stretch:112%}
.pcard .rl{color:var(--muted);font-size:13.5px}
.stat{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--line);padding-top:10px}
.stat span{color:var(--muted);font-size:13px}
.stat b{font:600 21px var(--f-mono)}
.stat b small{font-size:12px;color:var(--muted);font-weight:500;margin-right:4px}
.foot{margin-top:18px;color:var(--muted);font-size:13.5px;display:flex;gap:10px;align-items:center}

/* ---------- S2 data ---------- */
.s2grid{display:grid;grid-template-columns:620px 1fr;gap:34px;align-items:start}
.flow{position:relative;width:620px;height:370px}
.flow svg{position:absolute;inset:0}
.tile{position:absolute;display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:12px;font-size:13.5px;line-height:1.25}
.tile svg{position:static;width:22px;height:22px;flex:none;color:var(--teal)}
.tile small{display:block;color:var(--muted);font-size:11.5px}
.platform{position:absolute;left:270px;top:130px;width:150px;height:120px;border-radius:16px;display:grid;place-items:center;text-align:center;
  background:radial-gradient(circle at 50% 40%,rgba(31,181,170,.28),rgba(15,123,123,.12));border:1px solid var(--teal);font:800 16px var(--f-disp);font-stretch:110%}
.platform small{display:block;font:500 11.5px var(--f-body);color:var(--muted);margin-top:4px}
.scene.on .platform{animation:pop .55s cubic-bezier(.2,.9,.3,1.35) .9s both,pulsebox 2.4s ease-in-out 1.6s infinite}
@keyframes pulsebox{50%{box-shadow:0 0 0 10px rgba(31,181,170,.06),0 0 40px rgba(31,181,170,.35)}}
.dot{position:absolute;left:0;top:0;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:var(--teal);box-shadow:0 0 12px var(--teal);opacity:0;offset-rotate:0deg}
.scene.on .dot{animation:travel var(--t,2.2s) linear infinite;animation-delay:var(--d,0s)}
.dot.bad{background:var(--stop);box-shadow:0 0 12px var(--stop)}
.scene.on .dot.bad{animation:travelbad 2.2s ease-in infinite;animation-delay:var(--d,0s)}
@keyframes travel{0%{offset-distance:0%;opacity:0}10%{opacity:1}88%{opacity:1}100%{offset-distance:100%;opacity:0}}
@keyframes travelbad{0%{offset-distance:0%;opacity:0}15%{opacity:1}85%{offset-distance:100%;opacity:1;transform:scale(1)}100%{offset-distance:100%;opacity:0;transform:scale(2.4)}}
.blocked{position:absolute;left:421px;top:270px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:rgba(255,107,87,.15);border:1px solid var(--stop);color:var(--stop)}
.lockb{position:absolute;left:421px;top:96px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:rgba(31,181,170,.15);border:1px solid var(--teal);color:var(--teal)}
.blocked svg,.lockb svg{width:14px;height:14px}
.bnd{position:absolute;left:442px;font-size:11px;color:var(--muted);width:170px;line-height:1.3}
.calc{display:grid;gap:14px}
.calc .f{font:500 14px var(--f-mono);color:var(--muted);background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.calc .f b{color:var(--ink);font-weight:600}
.crow{display:grid;grid-template-columns:34px 1fr 64px;gap:12px;align-items:center}
.crow .avatar{--s:34px}
.crow .lbl{font-size:12.5px;color:var(--muted);margin-bottom:5px;font-family:var(--f-mono)}
.track{position:relative;height:14px;border-radius:7px;background:rgba(255,255,255,.06)}
.track i{position:absolute;inset:0 auto 0 0;border-radius:7px;width:0;background:var(--cc)}
.scene.on .track i{animation:grow 1.4s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d,0s)}
@keyframes grow{from{width:0}to{width:var(--w)}}
.cap{position:absolute;top:-6px;bottom:-6px;width:2px;background:var(--ink);border-radius:2px}
.cap::after{content:attr(data-l);position:absolute;top:-17px;left:50%;transform:translateX(-50%);font:600 10.5px var(--f-mono);color:var(--ink);white-space:nowrap}
.crow .val{font:700 20px var(--f-mono);text-align:right}

/* ---------- lanes (S3-S5) ---------- */
.lanegrid{display:grid;grid-template-columns:1fr 330px;gap:28px;align-items:start}
.lanes{display:grid;gap:12px}
.lhead,.lane{display:grid;grid-template-columns:170px repeat(var(--n),1fr) 150px;gap:10px;align-items:center}
.lhead div{font-size:11.5px;color:var(--muted);letter-spacing:.04em;line-height:1.25;padding:0 4px}
.lhead div b{display:block;color:var(--ink);font:600 12.5px var(--f-mono);letter-spacing:0;margin-top:2px}
.lane{position:relative;padding:12px 0}
.lane .who{display:flex;gap:10px;align-items:center;font:700 16px var(--f-disp);font-stretch:108%}
.lane .who .avatar{--s:36px}
.lane{--tl:180px;--tr:172px;--rr:160px}
.lane .rail2{position:absolute;left:var(--tl);right:var(--rr);top:50%;height:2px;background:var(--line);transform:translateY(-1px)}
.lane .tok{position:absolute;top:50%;left:var(--tl);width:14px;height:14px;margin-top:-7px;border-radius:50%;background:var(--cc);box-shadow:0 0 0 4px color-mix(in srgb,var(--cc) 30%,transparent),0 0 18px var(--cc);opacity:0;z-index:2}
.scene.on .lane .tok{animation:run var(--run,2.4s) cubic-bezier(.45,0,.55,1) both;animation-delay:var(--d)}
@keyframes run{0%{opacity:0;left:var(--tl)}8%{opacity:1}92%{opacity:1}100%{opacity:0;left:calc(100% - var(--tr))}}
.res{position:relative;z-index:1;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;gap:6px;font:600 15px var(--f-mono);
  background:var(--panel);border:1px solid var(--line)}
.res.ok{color:var(--ok)} .res.bad{color:var(--stop);background:rgba(255,107,87,.12);border-color:rgba(255,107,87,.55)}
.scene.on .res{animation:stamp .5s cubic-bezier(.2,.9,.3,1.5) both;animation-delay:var(--d)}
.scene.on .res.bad{animation:stamp .5s cubic-bezier(.2,.9,.3,1.5) both,shake .5s ease var(--d2) both;animation-delay:var(--d),var(--d2)}
@keyframes stamp{from{opacity:.0;transform:scale(1.5)}to{opacity:1;transform:none}}
@keyframes shake{20%,60%{transform:translateX(-4px)}40%,80%{transform:translateX(4px)}}
.res svg{width:15px;height:15px}
.lane .end{display:flex;justify-content:flex-start}
.side{padding:18px 20px;display:grid;gap:12px}
.side .t{font:700 15px var(--f-disp);font-stretch:108%}
.side .s{font-size:12.5px;color:var(--muted);line-height:1.45}
.gauge{display:grid;justify-items:center;position:relative}
.gauge .big{position:absolute;top:58px;font:800 34px var(--f-mono);color:var(--stop)}
.gauge .sub{position:absolute;top:100px;font-size:12px;color:var(--muted)}
.arc{stroke-dasharray:314.16;stroke-dashoffset:314.16}
.scene.on .arc{animation:arcfill 1.8s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d)}
@keyframes arcfill{to{stroke-dashoffset:var(--off)}}
.mbar{display:grid;gap:6px}
.mbar .track{height:16px}
.src{font-size:11.5px;color:var(--dim);font-family:var(--f-mono)}

/* tighten-only ruler */
.ruler{position:relative;height:150px;margin-top:4px}
.ruler .axis{position:absolute;left:0;right:0;top:96px;height:2px;background:var(--line2)}
.ruler .tick{position:absolute;top:92px;width:1px;height:10px;background:var(--line2)}
.ruler .tl{position:absolute;top:108px;transform:translateX(-50%);font:500 11px var(--f-mono);color:var(--muted)}
.ruler .reg{position:absolute;top:18px;bottom:40px;width:2px;background:var(--ink)}
.ruler .reg span{position:absolute;top:-16px;left:6px;font:600 11px var(--f-mono);white-space:nowrap}
.ruler .zone{position:absolute;top:18px;bottom:54px;background:repeating-linear-gradient(135deg,rgba(255,107,87,.16) 0 6px,transparent 6px 12px);border-left:0}
.mk{position:absolute;top:70px;transform:translateX(-50%);display:grid;justify-items:center;gap:2px}
.mk i{width:18px;height:18px;border-radius:50%;display:block;border:2px solid currentColor;background:var(--bg)}
.mk b{font:600 11.5px var(--f-mono)}
.mk.g{color:var(--ok)} .mk.r{color:var(--stop)}
.scene.on .mk{animation:dropin .6s cubic-bezier(.2,.9,.3,1.4) both;animation-delay:var(--d)}
.scene.on .mk.r{animation:dropin .6s cubic-bezier(.2,.9,.3,1.4) both,shakemk .5s ease both;animation-delay:var(--d),calc(var(--d) + .7s)}
@keyframes shakemk{0%,100%{transform:translateX(-50%)}20%,60%{transform:translateX(calc(-50% - 5px))}40%,80%{transform:translateX(calc(-50% + 5px))}}
@keyframes dropin{from{opacity:0;transform:translate(-50%,-50px)}to{opacity:1;transform:translateX(-50%)}}
.stampbox{justify-self:start;border:2px solid var(--stop);color:var(--stop);font:800 14px var(--f-disp);font-stretch:115%;letter-spacing:.1em;padding:4px 10px;border-radius:6px;transform:rotate(-4deg)}
.scene.on .stampbox{animation:stampin .45s cubic-bezier(.2,.9,.3,1.4) both;animation-delay:var(--d)}
@keyframes stampin{from{opacity:0;transform:rotate(-4deg) scale(2.2)}to{opacity:1;transform:rotate(-4deg)}}

/* layer funnel + code */
.funnel{display:grid;gap:6px;justify-items:center}
.layer{height:38px;border-radius:9px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;font:600 13px var(--f-body)}
.layer b{font:500 11.5px var(--f-mono);color:var(--muted)}
.layer.l1{width:100%;background:rgba(42,120,214,.18);box-shadow:inset 0 0 0 1px rgba(42,120,214,.5)}
.layer.l2{width:86%;background:rgba(31,181,170,.16);box-shadow:inset 0 0 0 1px rgba(31,181,170,.5)}
.layer.l3{width:72%;background:rgba(61,214,140,.14);box-shadow:inset 0 0 0 1px rgba(61,214,140,.45)}
.code{font:500 12.5px/1.65 var(--f-mono);background:#081022;border:1px solid var(--line);border-radius:10px;padding:10px 14px;color:#BFD3E6}
.code .k{color:var(--teal)} .code .s{color:#F2C979}
.typing{display:block;overflow:hidden;white-space:nowrap;width:0}
.scene.on .typing{animation:type .9s steps(28,end) both;animation-delay:var(--d)}
@keyframes type{to{width:100%}}

/* ---------- S6 grade ---------- */
.scalewrap{position:relative;margin:4px 0 0;padding-top:66px}
.scale{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}
.scale div{height:58px;border-radius:10px;display:grid;place-items:center;font:800 22px var(--f-mono);position:relative;overflow:hidden}
.z1{background:rgba(61,214,140,.13);color:var(--ok)} .z2{background:rgba(242,179,61,.16);color:var(--refer)} .z3{background:rgba(255,107,87,.16);color:var(--stop)}
.scan{position:absolute;top:66px;height:58px;width:80px;left:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.18),transparent);opacity:0;pointer-events:none}
.scene.on .scan{animation:scan 1.6s ease-in-out .3s both}
@keyframes scan{0%{left:-80px;opacity:1}100%{left:100%;opacity:0}}
.zl{display:grid;grid-template-columns:6fr 2fr 2fr;gap:6px;margin-top:8px;font-size:12.5px}
.zl div{border-top:2px solid currentColor;padding-top:6px}
.zl .a{color:var(--ok)} .zl .b{color:var(--refer)} .zl .c{color:var(--stop)}
.pinrow{position:absolute;top:0;left:0;right:0;height:62px}
.gpin{position:absolute;top:0;transform:translateX(-50%);display:grid;justify-items:center}
.gpin .avatar{--s:40px}
.gpin::after{content:"";width:2px;height:18px;background:var(--cc)}
.scene.on .gpin{animation:pinfall .8s cubic-bezier(.2,.9,.3,1.35) both;animation-delay:var(--d)}
@keyframes pinfall{from{opacity:0;transform:translate(-50%,-60px)}to{opacity:1;transform:translateX(-50%)}}
.gtiles{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:26px}
.gt{padding:14px 18px;display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:center}
.gt .avatar{--s:40px;grid-row:span 2}
.gt .g{font:800 30px var(--f-mono);line-height:1}
.gt .g small{font:500 13px var(--f-body);color:var(--muted);margin-left:8px}
.gt .why{grid-column:1 / -1;display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.gt .why span{font-size:12px;padding:3px 9px;border-radius:999px;background:rgba(255,255,255,.05);color:var(--muted)}
.gt .why span.neg{color:var(--refer);background:rgba(242,179,61,.1)}

/* ---------- S7 merge ---------- */
.merge{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.mcol{padding:16px 18px 18px;display:grid;gap:10px;justify-items:center;text-align:center}
.mcol .who{display:flex;gap:10px;align-items:center;font:800 18px var(--f-disp);font-stretch:110%}
.mcol .who .avatar{--s:36px}
.ins{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.inp{border:1px solid var(--line);border-radius:10px;padding:8px;display:grid;gap:3px;position:relative;background:rgba(255,255,255,.02)}
.inp small{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.inp b{font:700 14px var(--f-disp);font-stretch:105%}
.inp.strike::after{content:"";position:absolute;left:8px;right:8px;top:55%;height:3px;border-radius:3px;background:var(--stop);transform:scaleX(0);transform-origin:left}
.scene.on .inp.strike::after{animation:strike .5s ease both;animation-delay:var(--d2)}
.scene.on .inp.strike{animation:dimout .5s ease both;animation-delay:var(--d2)}
@keyframes strike{to{transform:scaleX(1)}}
@keyframes dimout{to{opacity:.55}}
.inp.glow{border-color:rgba(255,107,87,.6)}
.scene.on .inp.glow{animation:redglow 1.2s ease both;animation-delay:var(--d2)}
@keyframes redglow{50%{box-shadow:0 0 24px rgba(255,107,87,.55)}}
.conv{width:100%;height:46px}
.conv path{fill:none;stroke:var(--line2);stroke-width:2;stroke-dasharray:80;stroke-dashoffset:80}
.scene.on .conv path{animation:draw .7s ease both;animation-delay:var(--d)}
@keyframes draw{to{stroke-dashoffset:0}}
.verdict{font:800 19px var(--f-disp);font-stretch:112%;padding:12px 18px;border-radius:12px;width:100%;display:flex;align-items:center;justify-content:center;gap:9px}
.verdict svg{width:20px;height:20px}
.v-ok{background:rgba(61,214,140,.14);color:var(--ok);box-shadow:inset 0 0 0 1px rgba(61,214,140,.45),0 0 30px rgba(61,214,140,.15)}
.v-refer{background:rgba(242,179,61,.14);color:var(--refer);box-shadow:inset 0 0 0 1px rgba(242,179,61,.5),0 0 30px rgba(242,179,61,.15)}
.v-stop{background:rgba(255,107,87,.14);color:var(--stop);box-shadow:inset 0 0 0 1px rgba(255,107,87,.5),0 0 30px rgba(255,107,87,.18)}
.mcol .note{font-size:12.5px;color:var(--muted);line-height:1.4;min-height:36px}
.law{margin-top:16px;text-align:center;font:700 17px var(--f-disp);font-stretch:110%}
.law em{font-style:normal;color:var(--teal)}

/* ---------- S8 people + audit ---------- */
.s8grid{display:grid;grid-template-columns:1fr 540px;gap:30px}
.hrow{display:grid;grid-template-columns:40px 30px 46px 1fr;gap:12px;align-items:center;padding:14px 16px;margin-bottom:12px}
.hrow .avatar{--s:40px}
.arrow{height:2px;background:var(--line2);position:relative}
.arrow::after{content:"";position:absolute;right:-1px;top:-4px;border:5px solid transparent;border-left-color:var(--line2)}
.role{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.04);border:1px solid var(--line)}
.role svg{width:24px;height:24px}
.hrow .tx b{display:block;font:700 15px var(--f-disp);font-stretch:106%}
.hrow .tx span{font-size:12.5px;color:var(--muted)}
.chain{display:grid;gap:0;position:relative}
.blk{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;padding:10px 14px;border-radius:10px;background:#081022;border:1px solid var(--line);font:500 12.5px var(--f-mono);position:relative;transition:border-color .4s,background .4s}
.blk .n{color:var(--muted)}
.blk .h{color:var(--teal);font-size:11.5px}
.link{height:16px;width:2px;margin-left:38px;background:var(--teal);opacity:.6}
.blk.tam{border-color:var(--stop);background:rgba(255,107,87,.1)}
.blk.tam .h,.blk.broke .h{color:var(--stop)}
.blk.broke{border-color:rgba(255,107,87,.5)}
.link.broke{background:var(--stop);opacity:1;background:repeating-linear-gradient(180deg,var(--stop) 0 3px,transparent 3px 6px)}
.edit{color:var(--stop);font-weight:600}
.chainmsg{margin-top:12px;font-size:13px;color:var(--muted);min-height:20px;transition:color .4s}
.chainmsg.alert{color:var(--stop)}

/* ---------- S9 summary ---------- */
.sumrow{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.sc{padding:18px 20px;display:grid;gap:10px}
.sc .who{display:flex;gap:12px;align-items:center}
.sc .who .avatar{--s:42px}
.sc .who b{font:800 20px var(--f-disp);font-stretch:110%;display:block}
.sc .who span{font-size:12.5px;color:var(--muted)}
.sc .line{font-size:13px;color:var(--muted);line-height:1.45}
.jobs{margin-top:22px;display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
.job{padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.025);display:grid;gap:3px}
.job b{font:800 14px var(--f-disp);font-stretch:110%}
.job span{font-size:11.5px;color:var(--muted);line-height:1.35}
.job.me{border-color:var(--teal);background:rgba(31,181,170,.1);box-shadow:0 0 24px rgba(31,181,170,.15)}
.truth{margin-top:16px;display:grid;grid-template-columns:1fr 1fr;gap:12px;font-size:12.5px;color:var(--muted);line-height:1.45}
.truth div{display:flex;gap:10px;align-items:flex-start}
.truth i{flex:none;margin-top:5px;width:8px;height:8px;border-radius:50%}
.truth b{color:var(--ink)}

/* ---------- footer: caption + controls ---------- */
.ctrl{position:absolute;left:0;right:0;bottom:0;height:80px;border-top:1px solid var(--line);background:rgba(10,19,40,.75);backdrop-filter:blur(6px);
  display:grid;grid-template-columns:70px 1fr auto;gap:18px;align-items:center;padding:0 32px;z-index:3}
.prog{position:absolute;left:0;top:-1px;height:2px;width:0;background:var(--teal);box-shadow:0 0 10px var(--glow)}
.prog.run{animation:progress var(--dur) linear both}
@keyframes progress{to{width:100%}}
.count{font:600 14px var(--f-mono);color:var(--muted)}
.count b{color:var(--ink);font-size:20px}
#caption{font-size:15.5px;line-height:1.45;color:#D6E2EE;max-width:880px}
#caption.swap{animation:capin .6s ease both}
@keyframes capin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#caption b{color:#fff}
.btns{display:flex;gap:8px}
.cb{width:42px;height:42px;border-radius:50%;border:1px solid var(--line2);background:rgba(255,255,255,.03);color:var(--ink);display:grid;place-items:center;cursor:pointer;transition:background .2s,border-color .2s,transform .15s}
.cb:hover{border-color:var(--teal);background:rgba(31,181,170,.12)}
.cb:active{transform:scale(.94)}
.cb.main{width:50px;height:50px;background:var(--teal);border-color:var(--teal);color:#04201E}
.cb.main:hover{background:#2CC9BD}
.cb svg{width:18px;height:18px}
.cb:focus-visible{outline:2px solid var(--teal);outline-offset:3px}
.cb[disabled]{opacity:.35;cursor:default}

/* ---------- phone layout: a real portrait layout, not a shrunken slide ---------- */
.m-only{display:none}
#viewport.vm{display:block;background:var(--bg)}
#stage.m{width:100%;height:100%;border-radius:0;box-shadow:none;transform:none!important;margin-top:0;display:flex;flex-direction:column}
#stage.m .m-only{display:block}
#stage.m .bar{position:relative;flex:none;height:50px;padding:0 18px}
#stage.m .aud{display:none}
#stage.m .rail{position:relative;flex:none;left:auto;right:auto;top:auto;height:30px;margin:0 18px}
#stage.m .rail::before,#stage.m .rail .fill{top:calc(50% - 1px)}
#stage.m .node{font-size:0;gap:0;padding:0}
#stage.m .node.now i{transform:scale(1.15)}
#stage.m .scenes{position:relative;top:auto;height:auto;flex:1;min-height:0}
#stage.m .scene{padding:8px 18px 18px;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain}
#stage.m h2{font-size:25px;line-height:1.1}
#stage.m .eyebrow{font-size:10.5px;letter-spacing:.12em}
#stage.m .head{margin-bottom:14px}
#stage.m .ctrl{position:relative;flex:none;height:auto;grid-template-columns:auto 1fr;grid-template-areas:"cap cap" "count btns";
  gap:10px 12px;padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px))}
#stage.m #caption{grid-area:cap;font-size:14px;line-height:1.45}
#stage.m .count{grid-area:count}
#stage.m .btns{grid-area:btns;justify-self:end}
#stage.m .cb{width:44px;height:44px} #stage.m .cb.main{width:52px;height:52px}
/* title */
#stage.m .s0 .inner{gap:14px;margin-top:0}
#stage.m .s0 h1{font-size:42px;font-stretch:112%}
#stage.m .s0 p{font-size:15px}
#stage.m .trio .avatar{--s:48px}
#stage.m .s0 .m-only{font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
#stage.m .s0 .m-only b{color:var(--ink)}
/* applicants */
#stage.m .people{grid-template-columns:1fr;gap:12px}
#stage.m .pcard{padding:14px 16px;gap:10px;grid-template-columns:repeat(3,1fr)}
#stage.m .pcard .top{grid-column:1 / -1}
#stage.m .pcard .avatar{--s:42px}
#stage.m .pcard .nm{font-size:19px}
#stage.m .stat{display:grid;gap:2px;padding-top:8px}
#stage.m .stat span{font-size:11px}
#stage.m .stat b{font-size:15px}
#stage.m .pcard .stat:last-child,#stage.m .foot{display:none}
/* data in */
#stage.m .s2grid{grid-template-columns:1fr;gap:16px}
#stage.m .s2grid>*{min-width:0}
#stage.m .flow{transform:scale(var(--fz,.6));transform-origin:top left;margin-bottom:calc(-370px * (1 - var(--fz,.6)))}
#stage.m .calc{gap:10px}
#stage.m .calc .f{font-size:12.5px;padding:8px 12px}
#stage.m .crow .val{font-size:17px}
/* rule lanes */
#stage.m .lanegrid{grid-template-columns:1fr;gap:16px}
#stage.m .lanegrid>*{min-width:0}
#stage.m .lhead,#stage.m .lane{grid-template-columns:40px repeat(var(--n),minmax(0,1fr));gap:6px}
#stage.m .lhead>div:last-child,#stage.m .lane .end,#stage.m .lane .who .nm{display:none}
#stage.m .lhead div{font-size:10px;padding:0;letter-spacing:0}
#stage.m .lhead div b{font-size:11px}
#stage.m .lane{--tl:48px;--tr:16px;--rr:6px;padding:7px 0!important}
#stage.m .lane .who .avatar{--s:34px}
#stage.m .res{height:42px!important;font-size:13px!important;gap:3px;border-radius:8px}
#stage.m .res svg{width:12px;height:12px}
#stage.m .side{padding:14px 16px;gap:10px}
/* grade */
#stage.m .scalewrap{padding-top:48px}
#stage.m .pinrow{height:46px}
#stage.m .gpin .avatar{--s:28px}
#stage.m .gpin::after{height:10px}
#stage.m .scale{gap:3px}
#stage.m .scale div{height:40px;font-size:14px;border-radius:6px}
#stage.m .scan{top:48px;height:40px}
#stage.m .zl{grid-template-columns:1fr;gap:4px;font-size:12px}
#stage.m .zl div{border-top:0;border-left:3px solid currentColor;padding:0 0 0 8px}
#stage.m .gtiles{grid-template-columns:1fr;gap:10px;margin-top:16px}
#stage.m .gt{padding:10px 14px}
#stage.m .gt .g{font-size:24px}
/* decision */
#stage.m .merge{grid-template-columns:1fr;gap:10px}
#stage.m .mcol{padding:12px 14px;gap:8px}
#stage.m .conv,#stage.m .mcol .note{display:none}
#stage.m .verdict{font-size:16px;padding:9px 12px}
#stage.m .law{font-size:15px;margin-top:14px}
/* people + audit */
#stage.m .s8grid{grid-template-columns:1fr;gap:16px}
#stage.m .hrow{grid-template-columns:34px 16px 38px 1fr;gap:8px;padding:10px 12px;margin-bottom:8px}
#stage.m .hrow .avatar{--s:34px}
#stage.m .role{width:38px;height:38px}
#stage.m .hrow .tx span{display:none}
#stage.m .blk{grid-template-columns:38px 1fr auto;gap:8px;font-size:11.5px;padding:8px 10px}
#stage.m .link{margin-left:28px;height:10px}
/* summary */
#stage.m .sumrow{grid-template-columns:1fr;gap:10px}
#stage.m .sc{padding:12px 14px;gap:8px}
#stage.m .jobs{grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
#stage.m .truth{grid-template-columns:1fr}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .dot{display:none}
}
</style>

</head>
<body>
<div id="viewport">
<div id="stage">
  <div class="atmo"><div class="grid"></div><div class="orb"></div><div class="orb b"></div></div>

  <div class="bar">
    <div class="brand"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="1.5" y="1.5" width="21" height="21" rx="6" fill="#0F7B7B"/><path d="M6 15.5l3.5-4 3 2.5L18 7.5" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>AI Risk Score Card</div>
    <div class="aud">Prepared for <b>Mr Tanveer</b> and <b>Mr Abul Faisal</b> · 13 Nov 2026</div>
  </div>

  <nav class="rail" id="rail" aria-label="Steps"><div class="fill" id="railfill"></div></nav>

  <main class="scenes" id="scenes"></main>

  <footer class="ctrl">
    <div class="prog" id="prog"></div>
    <div class="count" id="count"></div>
    <div id="caption" aria-live="polite"></div>
    <div class="btns">
      <button class="cb" id="prev" aria-label="Previous scene"><svg viewBox="0 0 24 24" fill="none"><path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button class="cb main" id="play" aria-label="Pause"><svg id="playsvg" viewBox="0 0 24 24" fill="currentColor"></svg></button>
      <button class="cb" id="next" aria-label="Next scene"><svg viewBox="0 0 24 24" fill="none"><path d="M9 5l7 7-7 7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button class="cb" id="restart" aria-label="Start again"><svg viewBox="0 0 24 24" fill="none"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v4.5h4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </div>
  </footer>
</div>
</div>
<div id="hint">Turn your phone sideways for a bigger view.</div>

<script>
(function(){
const fmt = n => n.toLocaleString("en-US");
const I = {
  ok:'<svg viewBox="0 0 16 16" fill="none"><path d="M3 8.5l3 3 7-7" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  x:'<svg viewBox="0 0 16 16" fill="none"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>',
  person:'<svg viewBox="0 0 16 16" fill="none"><circle cx="8" cy="5" r="2.7" stroke="currentColor" stroke-width="1.8"/><path d="M3 14c.6-2.8 2.6-4.2 5-4.2s4.4 1.4 5 4.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>',
  play:'<path d="M8 5.5v13l11-6.5z"/>', pause:'<rect x="6.5" y="5" width="4" height="14" rx="1"/><rect x="13.5" y="5" width="4" height="14" rx="1"/>'
};
const P = [
  {k:"A",name:"Amira",role:"Teacher · expat · 34",cc:"var(--c1)",sal:15000,loan:120000,dbr:32,pay:"4,800",mult:8.0,score:735,grade:1,pd:"0.24%",
   why:[["Bureau score 735",0],["No late payments",0]],cb:[1,1,1,1],bank:[1,1,1],cred:[1,1],
   v:"ok",vt:"Approve",note:"Rules passed and the grade is in the safe zone."},
  {k:"R",name:"Rahul",role:"Sales executive · expat · 29",cc:"var(--c2)",sal:12000,loan:150000,dbr:46,pay:"5,520",mult:12.5,score:600,grade:7,pd:"6.2%",
   why:[["30-day late payment this year",1],["Debt burden 46%",1]],cb:[1,1,1,1],bank:[1,1,1],cred:[1,1],
   v:"refer",vt:"Refer to underwriter",note:"Every rule passed, but grade 7 means a person must look."},
  {k:"O",name:"Omar",role:"Store supervisor · UAE national · 41",cc:"var(--c3)",sal:9000,loan:200000,dbr:53,pay:"4,770",mult:22.2,score:640,grade:4,pd:"1.6%",
   why:[["Clean payment record",0],["Debt burden 53%",1]],cb:[0,0,1,1],bank:[1,0,1],cred:[1,1],
   v:"stop",vt:"Decline recommended",note:"The AI said yes. Three rules said no. The rules win."}
];
const av = (p,s) => `<span class="avatar" style="--cc:${p.cc}${s?`;--s:${s}px`:""}">${p.k}</span>`;
const vicon = v => v==="ok"?I.ok:v==="refer"?I.person:I.x;

/* ---------- lanes builder ---------- */
function lanes(cols, key, vals, endText, base){
  const n = cols.length, run = 2.2;
  let h = `<div class="lanes"><div class="lhead" style="--n:${n}"><div></div>${cols.map(c=>`<div>${c[0]}<b>${c[1]}</b></div>`).join("")}<div></div></div>`;
  P.forEach((p,li)=>{
    const d = base + li*0.75;
    const fails = p[key].filter(x=>!x).length;
    h += `<div class="lane" style="--n:${n};--cc:${p.cc}"><div class="rail2"></div><span class="tok" style="--d:${d}s;--run:${run}s"></span>
      <div class="who">${av(p)}<span class="nm">${p.name}</span></div>`;
    cols.forEach((c,ci)=>{
      const ok = p[key][ci], t = d + run*(ci+0.6)/(n+0.4);
      h += `<div class="res ${ok?"ok":"bad"}" style="--d:${t.toFixed(2)}s;--d2:${(t+.5).toFixed(2)}s">${ok?I.ok:I.x}${vals(p,ci)}</div>`;
    });
    const te = d + run;
    h += `<div class="end"><span class="pill ${fails?"p-stop":"p-ok"} pop" style="--d:${te.toFixed(2)}s">${fails?I.x+fails+" broken":I.ok+"All passed"}</span></div></div>`;
  });
  return h + `</div>`;
}

/* ---------- scenes ---------- */
const S = [];
S.push({rail:-1,dur:9000,cls:"s0",cap:"A walkthrough of how the platform decides a loan. It plays by itself; use the buttons or the arrow keys to pause or move.",
html:`<div class="inner">
  <div class="m-only in" style="--d:.1s">Prepared for <b>Mr Tanveer</b> and <b>Mr Abul Faisal</b></div>
  <div class="eyebrow in" style="--d:.2s">How the AI Risk Score Card decides a loan</div>
  <h1><span class="in" style="--d:.35s">Three applicants.</span><span class="t2 in" style="--d:.6s">One rulebook.</span></h1>
  <div class="trio">${P.map((p,i)=>av(p).replace('class="avatar"',`class="avatar" style="--d:${1.1+i*.18}s;--cc:${p.cc}"`)).join("")}</div>
  <p class="in" style="--d:1.6s">Three people ask a UAE bank for a personal loan on the same morning. Follow each one through the regulator's rules, the bank's policy and the AI grade, and see why the rules always have the last word.</p>
  <div class="chipline in" style="--d:1.9s"><span class="tagc"><b>Bank:</b> Demo Bank UAE (fictional)</span><span class="tagc"><b>Product:</b> personal loan, 48 months</span><span class="tagc"><b>Numbers:</b> produced by running the platform's code</span></div>
</div>`});

S.push({rail:0,dur:10000,cap:"Three customers, three different situations. All three are fictional, but their numbers were run through the real engine.",
html:`<div class="head"><div class="eyebrow in">The applicants</div><h2 class="in" style="--d:.1s">Three people apply on the <em>same morning</em></h2></div>

/* ---------- scale stage to fit ---------- */
const stage = document.getElementById("stage");
const viewport = document.getElementById("viewport");
function fit(){
  const vv = window.visualViewport;
  const w = Math.min(innerWidth, vv ? vv.width : innerWidth), h = Math.min(innerHeight, vv ? vv.height : innerHeight);
  const mobile = w < 760;                       // phones and small tablets in portrait get their own layout
  stage.classList.toggle("m", mobile); viewport.classList.toggle("vm", mobile);
  if(mobile){
    stage.style.transform = "";
    stage.style.setProperty("--fz", Math.min(1, (stage.clientWidth - 36) / 620).toFixed(3));
    return;
  }
  const pad = w > 700 ? 56 : 16;               // room so nothing touches or slips under the viewer's edges
  const s = Math.min((w - pad) / 1280, (h - pad) / 720);
  stage.style.transform = `scale(${s})`;
}
// swipe between scenes on touch screens
let tx = null, ty = null;
stage.addEventListener("touchstart", e=>{ const t=e.touches[0]; tx=t.clientX; ty=t.clientY; }, {passive:true});
stage.addEventListener("touchend", e=>{
  if(tx===null) return;
  const t=e.changedTouches[0], dx=t.clientX-tx, dy=t.clientY-ty; tx=ty=null;
  if(Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy)*1.5 && !e.target.closest("button")) go(cur + (dx<0 ? 1 : -1));
}, {passive:true});
addEventListener("resize", fit); if(window.visualViewport) visualViewport.addEventListener("resize", fit); fit();

/* ---------- player ---------- */
let cur = -1, playing = true, timer = null, timeouts = [], countTimers = [];
const prog = document.getElementById("prog"), cap = document.getElementById("caption");
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

function countUp(root){
  root.querySelectorAll("[data-count]").forEach(el=>{
    const end = +el.dataset.count, delay = (+el.dataset.delay||0)*1000, dur = 1100;
    el.textContent = reduce ? fmt(end) : "0";
    if(reduce) return;
    const t = setTimeout(()=>{
      const t0 = performance.now();
      const step = now=>{ const k=Math.min(1,(now-t0)/dur), e=1-Math.pow(1-k,3);
        el.textContent = fmt(Math.round(end*e)); if(k<1 && !stage.classList.contains("paused")) requestAnimationFrame(step); else el.textContent=fmt(end); };
      requestAnimationFrame(step);
    }, delay);
    countTimers.push(t);
  });
}
function go(i){
  i = Math.max(0, Math.min(S.length-1, i));
  [...timeouts, ...countTimers].forEach(clearTimeout); timeouts=[]; countTimers=[];
  const els = scenesEl.children;
  [...els].forEach((el,k)=>{el.classList.remove("on"); el.classList.toggle("past", k<i); el.setAttribute("aria-hidden","true")});
  // re-render scene so its animations and stateful bits restart cleanly
  const fresh = document.createElement("section");
  fresh.className = `scene ${S[i].cls||""}`; fresh.dataset.i = i; fresh.innerHTML = S[i].html;
  els[i].replaceWith(fresh); void fresh.offsetWidth;
  fresh.classList.add("on"); fresh.setAttribute("aria-hidden","false");
  cur = i;
  countUp(fresh);
  if(S[i].enter) timeouts = S[i].enter() || [];
  cap.innerHTML = S[i].cap; cap.classList.remove("swap"); void cap.offsetWidth; cap.classList.add("swap");
  document.getElementById("count").innerHTML = `<b>${String(i+1).padStart(2,"0")}</b> / ${S.length}`;
  const r = S[i].rail;
  railEl.querySelectorAll(".node").forEach((n,k)=>{n.classList.toggle("now",k===r); n.classList.toggle("done",k<r)});
  document.getElementById("railfill").style.width = r<0 ? "0" : (r/8*89)+"%";
  document.getElementById("prev").disabled = i===0;
  document.getElementById("next").disabled = i===S.length-1;
  schedule();
}
let remaining = 0, startedAt = 0;
function icon(){
  document.getElementById("playsvg").innerHTML = playing ? I.pause : I.play;
  document.getElementById("play").setAttribute("aria-label", playing ? "Pause" : "Play");
}
function schedule(){
  clearTimeout(timer);
  stage.classList.remove("paused");
  prog.classList.remove("run"); prog.style.width = ""; void prog.offsetWidth;
  prog.style.setProperty("--dur", S[cur].dur+"ms");
  remaining = S[cur].dur;
  if(cur===S.length-1){ prog.style.width="100%"; playing=false; icon(); return; }
  if(playing){ prog.classList.add("run"); startedAt = performance.now(); timer = setTimeout(()=>go(cur+1), remaining); }
  icon();
}
function setPlaying(p){
  playing = p; icon();
  if(p){
    if(cur===S.length-1){ go(0); return; }
    stage.classList.remove("paused");
    prog.classList.add("run"); startedAt = performance.now();
    timer = setTimeout(()=>go(cur+1), remaining);
  } else {
    stage.classList.add("paused");
    clearTimeout(timer); remaining = Math.max(400, remaining - (performance.now()-startedAt));
  }
}
document.getElementById("play").onclick = ()=>setPlaying(!playing);
document.getElementById("next").onclick = ()=>go(cur+1);
document.getElementById("prev").onclick = ()=>go(cur-1);
document.getElementById("restart").onclick = ()=>{ playing=true; go(0); };
railEl.addEventListener("click", e=>{const n=e.target.closest(".node"); if(n) go(S.findIndex(s=>s.rail===+n.dataset.r));});
addEventListener("keydown", e=>{
  if(e.key==="ArrowRight") go(cur+1);
  else if(e.key==="ArrowLeft") go(cur-1);
  else if(e.key===" " && !e.target.closest("button")){ e.preventDefault(); setPlaying(!playing); }
});
document.getElementById("playsvg").innerHTML = I.pause;
const start = /s=(\d+)/.exec(location.hash);
go(start ? +start[1] : 0);
})();
</script>
